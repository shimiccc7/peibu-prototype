name: 問題回報
description: 回報原型行為；請勿附真實孩子個資或完整備份
body:
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 使用虛構資料，描述日期／模式／操作順序。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期與實際結果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 裝置、瀏覽器、HTML或HTTP來源
  - type: checkboxes
    id: privacy
    attributes:
      label: 個資檢查
      options:
        - label: 沒有附孩子真名、課表、票券、錄音、密碼或完整家庭備份。
          required: true
